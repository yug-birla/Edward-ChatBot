version: '3.8'

services:
  backend:
    build: ./backend
    container_name: edward_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/users.db:/app/users.db # Persist the database
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}

  frontend:
    build: ./frontend
    container_name: edward_frontend
    ports:
      - "5173:80" # Map localhost:5173 to container port 80
    depends_on:
      - backend